name: Automated AI Status Log

on:
  schedule:
    - cron: '0 0 * * *' # Roz raat 12 baje (UTC) run hoga
  workflow_dispatch: # Button dabakar manual run karne ka option

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: python update_quote.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Automated AI Status Update [skip ci]" || exit 0
          git push
